site_name: "Atria"
site_description: A structured ML framework for reproducible training, evaluation, and explainability
site_author: "Saifullah Saifullah"
dev_addr: "127.0.0.1:8081"
docs_dir: pages

theme:
  name: shadcn
  icon: null
  topbar_sections: false
  pygments_style:
    light: shadcn-light
    dark: github-dark
  katex_options:
    trust: true

plugins:
  - search
  - mkdocstrings:
      enabled: !ENV [ENABLE_MKDOCSTRINGS, true]
      default_handler: python
      locale: en
      handlers:
        python:
          options:
            docstring_style: google
            ignore_init_summary: true
            docstring_section_style: list
            filters: public
            inherited_members: true
            summary: true
            heading_level: 1
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            show_bases: false

markdown_extensions:
  admonition:
  codehilite:
  fenced_code:
  footnotes:
  extra:
  pymdownx.blocks.details:
  pymdownx.tabbed:
    alternate_style: true
  pymdownx.blocks.tab:
    combine_header_slug: true
    separator: ___
  pymdownx.snippets:
  pymdownx.superfences:

